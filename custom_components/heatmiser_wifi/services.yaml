set_value:
  fields:
    name:
      required: true
    value:
      required: true

update_date_time:
    
update_triggers:
  fields:
    trigger:
      required: true
      selector:
        select:
          options:
            - "weekday_triggers"
            - "weekend_triggers"
    values:
      required: true
      description: "Four ordered hour,minute,temperature triples; minutes 0/30, temperature 5–30 °C."
      example: "6,30,20,8,0,17,17,0,21,22,30,16"
      selector:
        text:

hold_on:
  name: Start experimental timed hold
  description: "Start a fixed 30-minute hold. Requires enable_experimental_hold. Hardware expiry is not yet verified."
  fields:
    temperature:
      name: Temperature
      required: true
      selector:
        number:
          min: 5
          max: 30
          step: 1
          unit_of_measurement: "°C"
hold_off:
  name: Cancel experimental timed hold
  description: "Cancel the timer and let the thermostat resume its schedule. This does not force heating off."
